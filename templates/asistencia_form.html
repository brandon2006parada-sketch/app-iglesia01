{% extends "base.html" %}

{% block title %}{{ 'Editar' if registro else 'Registrar' }} asistencia · Iglesia Metodista{% endblock %}

{% block content %}
<section class="page-heading">
  <div><p class="eyebrow">Participación</p><h1>{{ 'Editar asistencia' if registro else 'Registrar asistencia' }}</h1></div>
  <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('asistencia') }}">Cancelar</a>
</section>

<form class="content-card form-card" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="fecha">Fecha de actividad</label>
    <input class="form-control" id="fecha" name="fecha" type="date" value="{{ registro.fecha if registro else hoy }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="tipo">Actividad</label>
    <select class="form-select" id="tipo" name="tipo" required>
      {% for clave, etiqueta in actividades.items() %}<option value="{{ clave }}" {% if registro and registro.tipo == clave %}selected{% endif %}>{{ etiqueta }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label" for="cantidad">Cantidad de asistentes</label>
    <input class="form-control" id="cantidad" name="cantidad" type="number" min="0" max="5000" step="1" value="{{ registro.cantidad if registro else 0 }}" required>
    <div class="form-text">Indica un número entre 0 y 5000.</div>
  </div>
  <div class="mb-4">
    <label class="form-label" for="notas">Notas (opcional)</label>
    <textarea class="form-control" id="notas" name="notas" rows="3" maxlength="500">{{ registro.notas if registro else '' }}</textarea>
  </div>
  <button class="btn btn-primary btn-lg w-100" type="submit">{{ 'Guardar cambios' if registro else 'Guardar asistencia' }}</button>
</form>
{% endblock %}
