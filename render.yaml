services:
  - type: web
    name: app-iglesia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLASK_ENV
        value: production
      - key: MONGO_DB_NAME
        value: iglesia
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
